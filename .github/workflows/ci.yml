name: CI (Code Quality & Build)

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-formatting:
    name: Check Prettier Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      # This checks formatting without altering files.
      # It fails the job instantly if a file doesn't match Prettier styles.
      - name: Run Prettier Check
        run: pnpm exec prettier --check .

  production-build:
    name: Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      # Fails the job instantly if there are TypeScript, compilation, or Vite syntax errors
      - name: Build Project
        run: pnpm build
